<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0809" />
  <meta name="robots" content="noindex" />
  <title>Pink Ink Society mudou de endereço</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px max(20px, env(safe-area-inset-left)); background: radial-gradient(90% 50% at 20% 0%, rgba(232,120,150,.25), transparent 70%), #0b0809; color: #fbeef1; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    main { max-width: 420px; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 34px; line-height: 1.05; margin: 14px 0 10px; }
    h1 em { color: #f3a6b8; }
    p { color: #cdbcc1; margin: 0 0 14px; }
    .spin { width: 40px; height: 40px; margin: 22px auto; border-radius: 50%; border: 4px solid #2a2024; border-top-color: #f3a6b8; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    button, a.btn { display: block; width: 100%; margin-top: 10px; padding: 14px 18px; border: 0; border-radius: 999px; font: 700 15px system-ui, sans-serif; cursor: pointer; text-decoration: none; }
    .pri { background: #f3a6b8; color: #2b0d16; }
    .sec { background: #1e171a; color: #fbeef1; box-shadow: 0 0 0 1px rgba(255,228,234,.14); }
    svg { color: #f3a6b8; }
  </style>
</head>
<body>
  <main>
    <svg width="72" height="72" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M60 46c-10-7-26-9-44-6v50c18-3 34-1 44 6 10-7 26-9 44-6V40c-18-3-34-1-44 6z"/><path d="M60 46v50"/><path d="M60 10c.8 6.4 4.6 10.2 11 11-6.4.8-10.2 4.6-11 11-.8-6.4-4.6-10.2-11-11 6.4-.8 10.2-4.6 11-11z" fill="currentColor" stroke="none"/></svg>
    <section data-step="levando">
      <h1>O Pink Ink mudou de <em>endereço</em></h1>
      <p>Levando seus <b id="qtd">livros</b> para o app novo… não precisa fazer nada.</p>
      <div class="spin" aria-label="Carregando"></div>
    </section>
    <section data-step="erro" hidden>
      <h1>Quase lá</h1>
      <p>Não consegui falar com o endereço novo agora. Seus livros continuam guardados neste aparelho — nada se perdeu.</p>
      <button id="tentar" class="pri">Tentar de novo</button>
      <button id="baixar" class="sec">Baixar meus dados (backup)</button>
      <a id="ir" class="btn sec" href="#">Abrir o endereço novo</a>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="ponte.js"></script>
</body>
</html>
